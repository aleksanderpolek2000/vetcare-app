server:
  port: 8080

spring:
  application:
    name: vetcare-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/vetcare_db
    username: vetcare_user
    password: vetcare_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true