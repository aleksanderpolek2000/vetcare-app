server:
  port: 8080

spring:
  application:
    name: vetcare-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/vetcare_db
    username: vetcare_user
    password: vetcare_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true


application:
  security:
    jwt:
      secret-key: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
      expiration: 86400000